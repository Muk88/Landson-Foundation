<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Landson Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-green: #2D5016;
            --color-green-dark: #1B3010;
            --color-red: #E31E24;
            --color-white: #FFFFFF;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-green-dark);
            color: var(--color-white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Background Effects */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/nandi-landscape.jpg');
            /* Assumes you upload the image folder too, or use a placeholder */
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: 0;
            transform: scale(1.1);
            animation: slowZoom 30s infinite alternate;
        }

        @keyframes slowZoom {
            from {
                transform: scale(1.1);
            }

            to {
                transform: scale(1.2);
            }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(45, 80, 22, 0.9), rgba(27, 48, 16, 0.8));
            z-index: 1;
        }

        /* Decorative Shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: var(--color-red);
            top: -100px;
            right: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: var(--color-green);
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, 30px);
            }
        }

        /* Main Content Card */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            background: rgba(255, 255, 255, 0.05);
            /* Glass effect */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            margin-bottom: 2rem;
            display: inline-block;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        /* If logo image is missing, this styles the text fallback */
        .logo-text {
            font-family: var(--font-heading);
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 0%, #d1fae5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: var(--color-red);
            margin: 0 auto 2rem;
            border-radius: 2px;
        }

        .loader {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 3rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--color-white);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .contact-info {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .contact-info:hover {
            background: rgba(227, 30, 36, 0.2);
            border-color: var(--color-red);
        }
    </style>
</head>

<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <!-- Optional Logo Placeholder -->
        <!-- <img src="images/logo1.png" alt="Landson Foundation" style="height: 60px; margin-bottom: 2rem;"> -->

        <div class="divider"></div>

        <h1>Something Extraordinary<br>Is in the Works.</h1>

        <p class="subtitle">
            The Landson Foundation website is currently undergoing a major upgrade to better serve our mission of
            empowering talent through education.
        </p>

        <a href="mailto:contact@landsonfoundation.org" class="contact-info">
            Inquiries: info@landsonfoundation.org
        </a>

        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <footer>
            &copy; 2026 Landson Foundation. All rights reserved.
        </footer>
    </div>
</body>

</html>

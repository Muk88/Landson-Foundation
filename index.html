<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landson Foundation | Talent For Education</title>
    <meta name="google-site-verification" content="RIsyyR3mWcOgh5gIGagvZvsv2hMQjH4lvs0ZDmzaDr4" />
    <meta name="description" content="Landson Foundation - Talent For Education. Coming Soon.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-green: #2D5016;
            --color-green-dark: #1B3010;
            --color-red: #E31E24;
            --color-white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--color-green-dark);
            color: var(--color-white);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hero Background Styling (From About Page) */
        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #1a2e12 0%, #0f1c0a 100%);
            overflow: hidden;
        }

        /* Decorative Grid Pattern */
        .hero-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.5;
        }

        /* Animated Circles */
        .hero-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .circle-1 {
            width: 500px;
            height: 500px;
            background: var(--color-green);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            background: var(--color-red);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 50px);
            }
        }

        /* Main Content */
        .content {
            z-index: 10;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .coming-soon {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
            display: block;
            font-weight: 600;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 0%, #a5d6a7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            color: var(--color-red);
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .subtitle::before,
        .subtitle::after {
            content: '';
            height: 2px;
            width: 40px;
            background: rgba(255, 255, 255, 0.2);
            display: block;
        }

        /* Social Icons */
        .social-links {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .social-link {
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-link:hover {
            color: var(--color-white);
            background: var(--color-red);
            border-color: var(--color-red);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(227, 30, 36, 0.3);
        }

        /* Loader Line */
        .loader-line {
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin: 3rem auto 0;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loader-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: var(--color-red);
            border-radius: 2px;
            animation: slideLoad 2s infinite ease-in-out;
        }

        @keyframes slideLoad {
            0% {
                left: -40%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="hero-bg">
        <div class="hero-pattern"></div>
        <div class="hero-circle circle-1"></div>
        <div class="hero-circle circle-2"></div>
    </div>

    <div class="content">
        <span class="coming-soon">Coming Soon</span>
        <h1>Landson<br>Foundation</h1>
        <div class="subtitle">Talent For Education</div>

        <div class="loader-line"></div>

                        d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z" />

        </div>
    </div>
</body>
